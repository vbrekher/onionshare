name: Verify Flatpak drag fix

on:
  push:
    branches:
      - fix/2033-flatpak-stale-lock

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tor obfs4proxy gcc python3-dev xvfb x11-utils libxkbcommon-x11-0 libxcb-randr0-dev libxcb-xtest0-dev libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xkb-dev libxcb-render-util0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0
          pip install --upgrade pip poetry
      - name: Install desktop environment
        run: cd desktop && poetry install
      - name: Check formatting
        run: cd desktop && poetry run black --check onionshare/tab/mode/file_selection.py tests/test_gui_dragdrop.py
      - name: Confirm drag regression fails before fix
        run: |
          git checkout e2b21c3dfbf988741b4de8a5f925cd9e12f5cf71 -- desktop/onionshare/tab/mode/file_selection.py
          if cd desktop && QT_QPA_PLATFORM=offscreen xvfb-run poetry run pytest -q tests/test_gui_dragdrop.py; then
            echo "Regression unexpectedly passed against upstream main"
            exit 1
          fi
          git checkout HEAD -- desktop/onionshare/tab/mode/file_selection.py
      - name: Focused regression
        run: cd desktop && QT_QPA_PLATFORM=offscreen xvfb-run poetry run pytest -v tests/test_gui_dragdrop.py
      - name: Desktop regression
        run: cd desktop && QT_QPA_PLATFORM=offscreen xvfb-run poetry run pytest -v ./tests/test_gui_*.py
